<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow Salon — Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c96b76'/%3E%3Cstop offset='1' stop-color='%23b8862b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='7' cy='7' r='2.2' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3Ccircle cx='7' cy='17' r='2.2' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3Cline x1='8.6' y1='8.4' x2='19' y2='19' stroke='%23fff' stroke-width='1.4' stroke-linecap='round'/%3E%3Cline x1='8.6' y1='15.6' x2='19' y2='5' stroke='%23fff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f7f5f3;
    --panel: #fbfaf9;
    --ink: #262023;
    --muted: #8a7f81;
    --line: #ebe6e3;
    --rose: #c96b76;
    --rose-deep: #a94f5a;
    --gold: #b8862b;
    --gold-soft: #d9a94a;
    --bubble-user: #f3e6e2;
    --bubble-ai: #ffffff;
    --danger: #d1544c;
    --ok: #3f9d67;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .shell {
    display: grid;
    grid-template-columns: 264px 1fr;
    height: 100vh;
  }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 0 1fr; }
    .sidebar { display: none; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px 18px;
  }
  .brand .mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(150deg, var(--rose), var(--gold));
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(185, 100, 70, 0.28);
  }
  .brand .name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16.5px;
  }

  .new-chat {
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .new-chat:hover { border-color: var(--rose); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

  .nav-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 8px 6px;
  }

  .thread-list { list-style: none; margin: 0; padding: 0; }
  .thread-list li {
    font-size: 13px;
    color: var(--ink);
    padding: 8px 9px;
    border-radius: 8px;
    cursor: default;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thread-list li.active { background: #efe4e0; font-weight: 500; }

  .sidebar-foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 8px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .sidebar-foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; height: 100vh; min-width: 0; }

  .topbar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .main.active .topbar { display: flex; }
  .topbar .avatar {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(150deg, var(--rose), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:13px; color:#fff;
  }
  .topbar .who .name { font-size: 13.5px; font-weight: 600; }
  .topbar .who .status { font-size: 11px; color: var(--muted); display:flex; align-items:center; gap:5px; }
  .topbar .who .status .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); }

  /* ---------- Empty state (centered, ChatGPT-style) ---------- */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(560px 320px at 50% 38%, rgba(201, 107, 118, 0.08), rgba(184, 134, 43, 0.05) 55%, transparent 75%);
  }
  .main.active .empty-state { display: none; }

  .empty-state h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    margin: 0 0 26px;
    color: var(--ink);
    text-align: center;
  }

  .empty-input-wrap { width: 100%; max-width: 640px; }

  .actions-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .action-link {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .action-link:hover { border-color: var(--rose); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .action-link svg { color: var(--rose); flex-shrink: 0; }
  .action-link:nth-child(2) svg { color: var(--gold); }
  .action-link:nth-child(3) svg { color: var(--ok); }

  /* ---------- Thread (active chat) ---------- */
  .thread {
    flex: 1;
    overflow-y: auto;
    display: none;
    padding: 26px clamp(16px, 12vw, 180px) 10px;
  }
  .main.active .thread { display: block; }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: #e4dcd8; border-radius: 8px; }

  .row {
    display: flex;
    gap: 12px;
    margin: 16px 0;
    animation: rise 0.25s ease both;
  }
  @keyframes rise { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  .row.user { flex-direction: row-reverse; }

  .row .av {
    width: 28px; height: 28px; border-radius: 8px;
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 600;
    font-family: 'Fraunces', serif;
    margin-top: 2px;
    box-shadow: 0 2px 5px rgba(185, 100, 70, 0.22);
  }
  .row.ai .av { background: linear-gradient(150deg, var(--rose), var(--gold)); color: #fff; }
  .row.user .av { background: var(--bubble-user); color: var(--rose-deep); border: 1px solid var(--line); }

  .bubble {
    max-width: 68ch;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .row.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--bubble-user); color: var(--ink); border-top-right-radius: 4px; }

  .bubble .msg-p { margin: 0 0 8px; }
  .bubble .msg-p:last-child { margin-bottom: 0; }
  .bubble .msg-list { margin: 4px 0 8px; padding-left: 18px; }
  .bubble .msg-list li { margin: 3px 0; }
  .bubble .msg-table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 13px; }
  .bubble .msg-table th, .bubble .msg-table td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
  .row.ai .bubble .msg-table th { background: #f7ede9; color: var(--rose-deep); font-weight: 600; }

  .confirm-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--ok);
    background: #eaf6ee; border: 1px solid #cdead8;
    padding: 5px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .confirm-badge.cancel { color: var(--danger); background: #fbeaea; border-color: #f3d0cf; }

  .voice-tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; opacity:0.7; margin-bottom:4px; }

  .typing {
    display: flex; gap: 4px;
    padding: 13px 15px;
    background: var(--bubble-ai);
    border: 1px solid var(--line);
    border-radius: 14px; border-top-left-radius: 4px;
    width: fit-content;
  }
  .typing span { width:6px; height:6px; border-radius:50%; background: var(--muted); animation: bob 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-3px);opacity:1;} }

  /* ---------- Composer (shared: pinned bottom in thread view, centered in empty state) ---------- */
  .composer-wrap { padding: 10px clamp(16px, 12vw, 180px) 22px; }
  .main.active .composer-wrap { padding-top: 6px; }

  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, #ffffff, #fdf8f6);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px 6px 6px 16px;
    box-shadow: 0 4px 16px rgba(185, 100, 70, 0.08), 0 1px 3px rgba(0,0,0,0.04);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }
  .composer:focus-within { border-color: var(--rose); box-shadow: 0 4px 18px rgba(201, 107, 118, 0.16); }
  .composer.recording { border-color: var(--danger); }

  .composer input {
    flex: 1;
    background: none; border: none; outline: none;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 0;
  }
  .composer input::placeholder { color: var(--muted); }
  .composer.recording input { display: none; }

  .level-meter {
    flex: 1;
    display: none;
    align-items: center;
    gap: 2px;
    height: 36px;
  }
  .composer.recording .level-meter { display: flex; }
  .level-meter .bar { width: 3px; min-height: 3px; border-radius: 3px; background: var(--danger); transition: height 0.06s linear; }

  .rec-timer {
    display: none;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--danger);
    font-weight: 600;
    padding-right: 2px;
  }
  .composer.recording .rec-timer { display: block; }

  .send-btn, .mic-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .send-btn { background: linear-gradient(150deg, var(--rose), var(--gold)); color: #fff; box-shadow: 0 2px 8px rgba(185, 100, 70, 0.3); }
  .send-btn:hover { background: linear-gradient(150deg, var(--rose-deep), var(--gold-soft)); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  .mic-btn { background: transparent; color: var(--muted); }
  .mic-btn:hover { color: var(--rose); background: rgba(201, 107, 118, 0.08); }
  .mic-btn.recording { background: var(--danger); color: #fff; }
  .mic-btn.speaking { color: var(--gold); }
  .mic-btn.speaking svg { animation: speak-pulse 0.9s ease-in-out infinite; }
  @keyframes speak-pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }

  .composer-hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; min-height: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .row, .typing span, .mic-btn.speaking svg { animation: none !important; }
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold-soft);
    outline-offset: 2px;
  }
  .composer input:focus-visible {
    outline: none;
  }
</style>
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.6"></circle>
          <circle cx="6" cy="18" r="2.6"></circle>
          <line x1="8" y1="7.6" x2="20" y2="19"></line>
          <line x1="8" y1="16.4" x2="20" y2="5"></line>
        </svg>
      </div>
      <div class="name">Glow Salon</div>
    </div>

    <button class="new-chat" id="new-chat-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New conversation
    </button>

    <div class="nav-label">Current session</div>
    <ul class="thread-list">
      <li class="active">Front desk chat</li>
    </ul>

    <div class="sidebar-foot"><span class="dot"></span> Front desk online</div>
  </aside>

  <div class="main" id="main">
    <div class="topbar">
      <div class="avatar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.6"></circle>
          <circle cx="6" cy="18" r="2.6"></circle>
          <line x1="8" y1="7.6" x2="20" y2="19"></line>
          <line x1="8" y1="16.4" x2="20" y2="5"></line>
        </svg>
      </div>
      <div class="who">
        <div class="name">Glow Salon Assistant</div>
        <div class="status"><span class="dot"></span> Active now</div>
      </div>
    </div>

    <div class="empty-state" id="empty-state">
      <h1>How can I help you at Glow Salon?</h1>
      <div class="empty-input-wrap">
        <form class="composer" id="composer-empty">
          <span class="rec-timer" id="rec-timer-empty">0:00</span>
          <input type="text" id="input-empty" placeholder="Message Glow Salon…" autocomplete="off" />
          <div class="level-meter" id="level-meter-empty"></div>
          <button type="button" class="mic-btn" id="mic-btn-empty" aria-label="Record a voice message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
          </button>
          <button type="submit" class="send-btn" id="send-btn-empty" aria-label="Send message">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
        <div class="actions-row">
          <div class="action-link" data-q="What services do you offer and what are the prices?">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"></path><path d="M3 9h18"></path></svg>
            Services &amp; pricing
          </div>
          <div class="action-link" data-q="Do you have any appointments available tomorrow?">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Check availability
          </div>
          <div class="action-link" data-q="I'd like to book a haircut.">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
            Book an appointment
          </div>
        </div>
      </div>
    </div>

    <div class="thread" id="thread" aria-live="polite"></div>

    <div class="composer-wrap" id="composer-wrap-active" style="display:none;">
      <form class="composer" id="composer-active">
        <span class="rec-timer" id="rec-timer-active">0:00</span>
        <input type="text" id="input-active" placeholder="Message Glow Salon…" autocomplete="off" />
        <div class="level-meter" id="level-meter-active"></div>
        <button type="button" class="mic-btn" id="mic-btn-active" aria-label="Record a voice message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </button>
        <button type="submit" class="send-btn" id="send-btn-active" aria-label="Send message">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
      <div class="composer-hint" id="hint-active">Glow Salon can make mistakes. Confirm booking details before you rely on them.</div>
    </div>
  </div>

</div>

<script>
(function () {
  const API_CHAT = '/chat';
  const API_VOICE = '/chat/voice';
  const MAX_RECORD_MS = 60000;
  const METER_BARS = 28;
  const AI_MARK_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"></circle><circle cx="6" cy="18" r="2.6"></circle><line x1="8" y1="7.6" x2="20" y2="19"></line><line x1="8" y1="16.4" x2="20" y2="5"></line></svg>';

  const mainEl = document.getElementById('main');
  const emptyState = document.getElementById('empty-state');
  const thread = document.getElementById('thread');
  const composerWrapActive = document.getElementById('composer-wrap-active');
  const newChatBtn = document.getElementById('new-chat-btn');

  function getSessionId() {
    let id = localStorage.getItem('glow-session-id');
    if (!id) {
      id = 'web-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now();
      localStorage.setItem('glow-session-id', id);
    }
    return id;
  }
  let sessionId = getSessionId();

  function activateThreadView() {
    if (!mainEl.classList.contains('active')) {
      mainEl.classList.add('active');
      composerWrapActive.style.display = '';
    }
  }

  function resetConversation() {
    sessionId = 'web-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now();
    localStorage.setItem('glow-session-id', sessionId);
    thread.innerHTML = '';
    mainEl.classList.remove('active');
    composerWrapActive.style.display = 'none';
    inputEmpty.value = '';
    inputEmpty.focus();
  }
  newChatBtn.addEventListener('click', resetConversation);

  // ---------- Markdown rendering ----------
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<!\*)\*(?!\*)(.+?)\*(?!\*)/g, '<em>$1</em>');
  }
  function renderMarkdown(raw) {
    const lines = escapeHtml(raw).split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] && /^\s*\|?[\s:-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        const headerCells = line.split('|').map((c) => c.trim()).filter((c) => c.length);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          rows.push(lines[i].split('|').map((c) => c.trim()).filter((c) => c.length));
          i++;
        }
        html += '<table class="msg-table"><thead><tr>' +
          headerCells.map((c) => `<th>${inline(c)}</th>`).join('') +
          '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
          '</tbody></table>';
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
          i++;
        }
        html += '<ul class="msg-list">' + items.map((it) => `<li>${inline(it)}</li>`).join('') + '</ul>';
        continue;
      }
      if (line.trim() === '') {
        html += '<br/>';
      } else {
        html += `<p class="msg-p">${inline(line)}</p>`;
      }
      i++;
    }
    return html;
  }
  function confirmationBadge(text) {
    const lower = text.toLowerCase();
    const hasBookingId = /\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/i.test(text);
    if (hasBookingId && /cancel/.test(lower)) return badgeEl('Cancelled — email sent', 'cancel');
    if (hasBookingId && /(confirm|booked|appointment is set)/.test(lower)) return badgeEl('Confirmed — email sent', '');
    return null;
  }
  function badgeEl(label, extraClass) {
    const el = document.createElement('div');
    el.className = 'confirm-badge' + (extraClass ? ' ' + extraClass : '');
    el.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' + label;
    return el;
  }

  // ---------- Message rows ----------
  function addRow(text, who, opts) {
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const av = document.createElement('div');
    av.className = 'av';
    av.innerHTML = who === 'ai' ? AI_MARK_SVG : 'Y';
    row.appendChild(av);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (opts.voice) {
      const badge = who === 'ai' ? confirmationBadge(text) : null;
      if (badge) bubble.appendChild(badge);
      const tag = document.createElement('div');
      tag.className = 'voice-tag';
      tag.textContent = '🎙 Voice message';
      bubble.appendChild(tag);
      if (text) {
        const t = document.createElement('div');
        t.innerHTML = who === 'ai' ? renderMarkdown(text) : escapeHtml(text);
        bubble.appendChild(t);
      }
    } else if (who === 'ai') {
      const badge = confirmationBadge(text);
      if (badge) bubble.appendChild(badge);
      const body = document.createElement('div');
      body.innerHTML = renderMarkdown(text);
      bubble.appendChild(body);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typing-row';
    const av = document.createElement('div');
    av.className = 'av';
    av.innerHTML = AI_MARK_SVG;
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(av);
    row.appendChild(typing);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }
  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // ---------- Send (shared by both composers) ----------
  async function sendMessage(message) {
    activateThreadView();
    addRow(message, 'user');
    setSendingState(true);
    addTyping();

    try {
      const res = await fetch(API_CHAT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message }),
      });
      const data = await res.json();
      removeTyping();
      addRow(data && data.success ? data.reply : "Sorry, something went wrong on my end. Please try again.", 'ai');
    } catch (err) {
      removeTyping();
      addRow("I couldn't reach the front desk. Check your connection and try again.", 'ai');
      console.error('Chat error:', err);
    } finally {
      setSendingState(false);
    }
  }

  function setSendingState(disabled) {
    sendBtnEmpty.disabled = disabled;
    sendBtnActive.disabled = disabled;
  }

  // ---------- Wire up both composer instances (empty-state + active thread) ----------
  const composerEmpty = document.getElementById('composer-empty');
  const inputEmpty = document.getElementById('input-empty');
  const sendBtnEmpty = document.getElementById('send-btn-empty');
  const micBtnEmpty = document.getElementById('mic-btn-empty');
  const levelMeterEmpty = document.getElementById('level-meter-empty');
  const recTimerEmpty = document.getElementById('rec-timer-empty');

  const composerActive = document.getElementById('composer-active');
  const inputActive = document.getElementById('input-active');
  const sendBtnActive = document.getElementById('send-btn-active');
  const micBtnActive = document.getElementById('mic-btn-active');
  const levelMeterActive = document.getElementById('level-meter-active');
  const recTimerActive = document.getElementById('rec-timer-active');
  const hintActive = document.getElementById('hint-active');
  const defaultHintActive = hintActive.textContent;

  composerEmpty.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = inputEmpty.value.trim();
    if (!msg) return;
    inputEmpty.value = '';
    sendMessage(msg);
  });
  composerActive.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = inputActive.value.trim();
    if (!msg) return;
    inputActive.value = '';
    sendMessage(msg);
  });

  document.querySelectorAll('[data-q]').forEach((el) => {
    el.addEventListener('click', () => sendMessage(el.getAttribute('data-q')));
  });

  // ---------- Voice recorder factory: one instance per composer ----------
  function createVoiceRecorder({ micBtn, composerEl, levelMeter, recTimerEl, hintEl, defaultHint }) {
    for (let i = 0; i < METER_BARS; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      levelMeter.appendChild(bar);
    }
    const meterBars = Array.from(levelMeter.children);

    let mediaRecorder = null;
    let audioChunks = [];
    let recording = false;
    let audioCtx = null;
    let analyser = null;
    let rafId = null;
    let recordStartedAt = 0;
    let timerId = null;
    let autoStopId = null;

    function pickMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    function setHint(text) { if (hintEl) hintEl.textContent = text; }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - recordStartedAt) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      recTimerEl.textContent = m + ':' + String(s).padStart(2, '0');
    }

    function drawLevels() {
      if (!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      const step = Math.floor(data.length / meterBars.length) || 1;
      for (let i = 0; i < meterBars.length; i++) {
        const v = data[i * step] || 0;
        meterBars[i].style.height = Math.max(3, Math.round((v / 255) * 32)) + 'px';
      }
      rafId = requestAnimationFrame(drawLevels);
    }

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setHint('Voice input is not supported in this browser.');
        setTimeout(() => setHint(defaultHint), 3000);
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        const mimeType = pickMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          const type = mediaRecorder.mimeType || 'audio/webm';
          const blob = new Blob(audioChunks, { type });
          if (blob.size < 500) {
            setHint('That was too short — hold the mic and speak.');
            setTimeout(() => setHint(defaultHint), 2500);
            return;
          }
          await sendVoice(blob, type);
        };

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        mediaRecorder.start();
        recording = true;
        recordStartedAt = Date.now();
        micBtn.classList.add('recording');
        composerEl.classList.add('recording');
        setHint('Listening — tap to send');

        drawLevels();
        timerId = setInterval(updateTimer, 250);
        updateTimer();
        autoStopId = setTimeout(() => stop(), MAX_RECORD_MS);
      } catch (err) {
        console.error('Microphone error:', err);
        let msg = "Couldn't access your microphone.";
        if (err && err.name === 'NotAllowedError') msg = 'Microphone access was blocked — allow it in your browser settings.';
        else if (err && err.name === 'NotFoundError') msg = 'No microphone was found on this device.';
        setHint(msg);
        setTimeout(() => setHint(defaultHint), 3500);
      }
    }

    function stop() {
      if (!recording) return;
      recording = false;
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (rafId) cancelAnimationFrame(rafId);
      if (timerId) clearInterval(timerId);
      if (autoStopId) clearTimeout(autoStopId);
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      micBtn.classList.remove('recording');
      composerEl.classList.remove('recording');
      meterBars.forEach((b) => (b.style.height = '3px'));
      recTimerEl.textContent = '0:00';
      setHint(defaultHint);
    }

    micBtn.addEventListener('click', () => { recording ? stop() : start(); });

    return { setSpeaking: (on) => micBtn.classList.toggle('speaking', on) };
  }

  const recorderEmpty = createVoiceRecorder({
    micBtn: micBtnEmpty, composerEl: composerEmpty, levelMeter: levelMeterEmpty,
    recTimerEl: recTimerEmpty, hintEl: null, defaultHint: '',
  });
  const recorderActive = createVoiceRecorder({
    micBtn: micBtnActive, composerEl: composerActive, levelMeter: levelMeterActive,
    recTimerEl: recTimerActive, hintEl: hintActive, defaultHint: defaultHintActive,
  });

  async function sendVoice(blob, mimeType) {
    activateThreadView();
    addRow('', 'user', { voice: true });
    addTyping();
    hintActive.textContent = 'Thinking…';

    const ext = mimeType.includes('mp4') ? 'm4a' : mimeType.includes('ogg') ? 'ogg' : 'webm';
    const formData = new FormData();
    formData.append('sessionId', sessionId);
    formData.append('audio', blob, 'recording.' + ext);

    try {
      const res = await fetch(API_VOICE, { method: 'POST', body: formData });
      const data = await res.json();
      removeTyping();
      hintActive.textContent = defaultHintActive;

      if (data && data.success) {
        addRow(data.reply, 'ai');
        if (data.audioBase64) playReply(data.audioBase64);
      } else {
        addRow(data.reply || "Sorry, I couldn't process that.", 'ai');
      }
    } catch (err) {
      removeTyping();
      hintActive.textContent = defaultHintActive;
      addRow("I couldn't reach the front desk. Check your connection and try again.", 'ai');
      console.error('Voice error:', err);
    }
  }

  function playReply(base64) {
    const audio = new Audio('data:audio/mp3;base64,' + base64);
    recorderEmpty.setSpeaking(true);
    recorderActive.setSpeaking(true);
    audio.play().catch((err) => console.error('Playback error:', err));
    audio.onended = () => { recorderEmpty.setSpeaking(false); recorderActive.setSpeaking(false); };
  }

  inputEmpty.focus();
})();
</script>

</body>
